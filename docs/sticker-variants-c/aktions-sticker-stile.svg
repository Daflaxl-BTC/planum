<radialGradient id="rgLeaf2" cx="40%" cy="35%" r="78%"><stop offset="0" stop-color="#5aa063"/><stop offset="1" stop-color="#1c4a2a"/></radialGradient>
<radialGradient id="rgDew" cx="38%" cy="30%" r="70%"><stop offset="0" stop-color="#f2faff"/><stop offset="0.5" stop-color="#add3f0"/><stop offset="1" stop-color="#4a86b8"/></radialGradient>
